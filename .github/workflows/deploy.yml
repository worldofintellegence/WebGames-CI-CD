name: Build and Deploy Web Games Pipeline

on:
  push:
    branches:
      - '*'
      - '!gh-pages'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # JOB 1: Game Branch Push -> Build WebGL & Deploy Subfolder
  # ==========================================
  build-and-deploy-game:
    if: github.ref_name != 'main' && github.ref_name != 'master'
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Cache Unity Library Folder
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: 3. Build Unity WebGL Game
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: WebGL
          buildName: ${{ github.ref_name }}
          buildMethod: CIEL.WebGames.Editor.GameConfigManager.BuildWebGLProject
          customParameters: -customBuildPath build/WebGL

      - name: 4. Fix Build Permissions & Ensure .nojekyll File
        run: |
          sudo chown -R $USER:$USER build/WebGL || true
          mkdir -p build/WebGL
          touch build/WebGL/.nojekyll

      - name: 5. Checkout gh-pages Branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-repo

      - name: 6. Update Catalog & Prepare Game Folder
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          CONFIG_PATH: game-config.json
          GAMES_JSON_PATH: gh-pages-repo/games.json
        run: |
          python3 .github/scripts/update_catalog.py
          mkdir -p gh-pages-repo/${{ github.ref_name }}
          if [ -d "build/WebGL/${{ github.ref_name }}" ]; then
            cp -r build/WebGL/${{ github.ref_name }}/* gh-pages-repo/${{ github.ref_name }}/
          else
            cp -r build/WebGL/* gh-pages-repo/${{ github.ref_name }}/
          fi
          touch gh-pages-repo/.nojekyll
          touch gh-pages-repo/${{ github.ref_name }}/.nojekyll

      - name: 7. Deploy WebGL Game & Updated Catalog to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: gh-pages-repo
          target-folder: .
          branch: gh-pages
          clean: false

  # ==========================================
  # JOB 2: Main Branch Push -> Deploy Central Portal (Root)
  # ==========================================
  deploy-portal:
    if: github.ref_name == 'main' || github.ref_name == 'master'
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Prepare Portal Folder
        run: |
          mkdir -p Portal
          touch Portal/.nojekyll

      - name: 3. Deploy Portal Interface to Root of gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: Portal
          target-folder: .
          branch: gh-pages
          clean: false
